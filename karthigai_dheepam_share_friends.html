<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8edcff">
<title>இனிய கார்த்திகை திருநாள்</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Noto Sans Tamil",sans-serif}
  body{background:linear-gradient(180deg,#79cafa 0%,#b7e9ff 55%,#e5f8ff 100%);color:#56321c}
  .scene{height:100dvh;width:100%;max-width:480px;margin:auto;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center}
  .stars{position:absolute;inset:0;opacity:.5;background-image:radial-gradient(#fff 1px,transparent 1.8px);background-size:39px 43px}
  h1{z-index:1;text-align:center;font-size:clamp(20px,6vw,29px);line-height:1.5;margin:26px 12px 0;color:#fff;text-shadow:0 2px 5px #478bb2}
  .hint{z-index:1;margin:7px 18px 0;text-align:center;font-size:13px;color:#285879}
  .ground{position:absolute;bottom:0;left:-10%;width:120%;height:26%;border-radius:50% 50% 0 0;background:linear-gradient(#b9e8b4,#5caa74)}
  .lamp-area{position:absolute;bottom:15%;left:50%;transform:translateX(-50%);width:190px;height:150px;display:flex;justify-content:center;align-items:flex-end}
  .diya{position:relative;width:164px;height:67px;border-radius:12px 12px 80px 80px/12px 12px 55px 55px;background:linear-gradient(180deg,#ffcf68,#b85a1d 65%,#7e3518);box-shadow:inset 0 7px 10px #ffe5a0,0 9px 14px #326b4d66;cursor:pointer}
  .diya:before{content:"";position:absolute;top:-8px;left:9px;width:146px;height:20px;border-radius:50%;background:linear-gradient(#ffe7a2,#bd6a2d);border:2px solid #a94d1d}
  .oil{position:absolute;top:-3px;left:24px;width:116px;height:11px;border-radius:50%;background:#ffdc79}
  .wick{position:absolute;top:-19px;left:80px;width:5px;height:21px;background:#49301f;border-radius:4px;transform:rotate(8deg)}
  .flame{position:absolute;left:69px;top:-76px;width:28px;height:59px;opacity:0;transform-origin:50% 100%;background:radial-gradient(ellipse at 50% 70%,#fff9b0 0 17%,#ffdb36 38%,#ff8a18 70%,#ff4a00 100%);border-radius:55% 45% 50% 50% / 70% 70% 30% 30%;filter:drop-shadow(0 0 13px #ff9c21);transition:opacity .35s}
  .flame.lit{opacity:1;animation:flicker .16s infinite alternate}
  @keyframes flicker{from{transform:rotate(-4deg) scale(.96)}to{transform:rotate(4deg) scale(1.05)}}
  .matchbox{position:absolute;bottom:9%;left:7%;width:92px;height:49px;border-radius:7px;background:linear-gradient(135deg,#e34d39,#a92026);color:#fff;text-align:center;padding-top:13px;font-size:12px;box-shadow:0 5px 9px #315c4b66}
  .matchbox:after{content:"";position:absolute;right:6px;top:5px;width:7px;height:39px;background:repeating-linear-gradient(0deg,#f6c1a0 0 2px,#692a2a 2px 4px);border-radius:3px}
  .match{position:absolute;bottom:13%;left:36%;width:94px;height:18px;z-index:5;transform:rotate(-13deg);touch-action:none;cursor:grab}
  .stick{position:absolute;left:0;top:6px;width:78px;height:6px;border-radius:4px;background:linear-gradient(#f4d7a1,#b67a3d)}
  .head{position:absolute;left:75px;top:3px;width:15px;height:12px;border-radius:60% 45% 45% 60%;background:#8b2b20}
  .match.fire .head{background:#ff8b12;box-shadow:0 0 8px 4px #ff9a20}
  .match.fire .head:after{content:"";position:absolute;left:3px;top:-12px;width:10px;height:18px;border-radius:50%;background:#ffd84a;box-shadow:0 0 12px #ff8c19}
  .instruction{position:absolute;bottom:3%;left:12px;right:12px;text-align:center;font-size:12px;color:#255b42;z-index:2}
  .message{position:absolute;top:20%;left:8px;right:8px;text-align:center;font-weight:800;font-size:clamp(20px,6vw,28px);line-height:1.6;color:#b43b13;text-shadow:0 1px #fff6;opacity:0;transform:scale(.8);transition:.5s;z-index:4}
  .message.show{opacity:1;transform:scale(1)}
  .share{position:absolute;z-index:8;top:12px;right:12px;border:0;border-radius:22px;background:#fff;color:#245b78;padding:9px 13px;font-weight:700;box-shadow:0 3px 9px #386a8844}
  .again{position:absolute;z-index:8;bottom:20%;border:0;border-radius:22px;background:#fff2d4;color:#7a3d16;padding:10px 17px;font-weight:700;display:none}
  .again.show{display:block}

  

  .reveal{position:absolute;inset:0;z-index:20;background:#100b12;opacity:0;visibility:hidden;transition:opacity .8s ease}
  .reveal.open{opacity:1;visibility:visible}
  .reveal .close{position:absolute;top:14px;right:14px;z-index:30;border:0;border-radius:20px;padding:9px 13px;background:#fff;color:#6d3214;font-weight:700}
  .final-image-scene{position:absolute;inset:0;overflow:hidden;background:#100b12}
  .final-image{position:absolute;width:100%;height:100%;object-fit:contain;inset:0;opacity:0;transform:scale(1.025);transition:opacity 1.1s ease .65s,transform 1.8s ease .65s}
  .reveal.open .final-image{opacity:1;transform:scale(1)}
  .swing-door{position:absolute;z-index:5;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#3a160c,#a85d23 22%,#4d1e0e 58%,#c48a3e 94%,#42170b);border:8px ridge #d5a34b;box-shadow:inset 0 0 28px #160b07,0 0 16px #ffca62;transition:transform 2.2s cubic-bezier(.2,.75,.2,1)}
  .left-door{left:0;transform-origin:left center}
  .right-door{right:0;transform-origin:right center}
  .door-design{position:absolute;inset:9%;border:5px double #f4ce72;display:grid;place-items:center;color:#ffdf80;font-size:clamp(65px,18vw,110px);text-shadow:0 0 12px #ffb32d;background:repeating-linear-gradient(90deg,transparent 0 27px,#f3bd5730 28px 31px)}
  .reveal.open .left-door{transform:perspective(900px) rotateY(-108deg)}
  .reveal.open .right-door{transform:perspective(900px) rotateY(108deg)}


  .amman-aura{position:absolute;z-index:7;left:50%;top:50%;width:min(74vw,330px);height:min(56vh,430px);transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity .25s ease}
  .reveal.open .amman-aura{opacity:1}
  /* No halo rings: individual gold motes drift and twinkle irregularly around Amman. */
  .amman-aura span,.amman-aura i{position:absolute;display:block;border-radius:50%;background:radial-gradient(circle,#fffde0 0 18%,#ffe78a 35%,#f8b82d 65%,#e98a16 100%);box-shadow:0 0 5px 2px #ffd34d,0 0 13px 4px #ffb52c;animation:goldDrift var(--dur,2.3s) ease-in-out infinite alternate, goldBlink var(--blink,1.1s) ease-in-out infinite alternate}
  .amman-aura span{width:7px;height:7px}
  .amman-aura i{width:4px;height:4px}
  .amman-aura span:nth-child(1){left:13%;top:20%;--dur:2.1s;--blink:.8s}
  .amman-aura span:nth-child(2){left:79%;top:16%;--dur:2.8s;--blink:1.2s}
  .amman-aura span:nth-child(3){left:7%;top:48%;--dur:2.5s;--blink:.9s}
  .amman-aura span:nth-child(4){left:89%;top:43%;--dur:1.9s;--blink:1.3s}
  .amman-aura span:nth-child(5){left:22%;top:77%;--dur:2.6s;--blink:.7s}
  .amman-aura span:nth-child(6){left:73%;top:82%;--dur:2.2s;--blink:1s}
  .amman-aura i:nth-of-type(1){left:31%;top:10%;--dur:1.8s}
  .amman-aura i:nth-of-type(2){left:60%;top:8%;--dur:2.4s}
  .amman-aura i:nth-of-type(3){left:3%;top:33%;--dur:2.2s}
  .amman-aura i:nth-of-type(4){left:96%;top:30%;--dur:2.7s}
  .amman-aura i:nth-of-type(5){left:16%;top:61%;--dur:1.7s}
  .amman-aura i:nth-of-type(6){left:84%;top:64%;--dur:2.5s}
  .amman-aura i:nth-of-type(7){left:38%;top:89%;--dur:2.1s}
  .amman-aura i:nth-of-type(8){left:56%;top:92%;--dur:2.9s}
  .amman-aura i:nth-of-type(9){left:43%;top:24%;--dur:1.9s}
  .amman-aura i:nth-of-type(10){left:66%;top:52%;--dur:2.6s}
  @keyframes goldDrift{0%{translate:-3px 5px}50%{translate:5px -8px}100%{translate:2px 6px}}
  @keyframes goldBlink{0%{opacity:.25;scale:.65;filter:brightness(.8)}100%{opacity:1;scale:1.45;filter:brightness(1.8)}}
  .foreground-flame{position:absolute;z-index:6;left:50%;bottom:8.5%;width:25px;height:66px;transform:translateX(-50%);opacity:0;pointer-events:none}
  .reveal.open .foreground-flame{opacity:1}
  .foreground-flame:before{content:"";position:absolute;inset:0 1px 0;background:radial-gradient(ellipse at 50% 76%,#fffde0 0 13%,#fff18a 23%,#ffc52d 49%,#ff8217 73%,#ef3f08 100%);border-radius:55% 45% 52% 48%/72% 72% 28% 28%;filter:drop-shadow(0 0 8px #ffad21) drop-shadow(0 0 18px #ff8b16);transform-origin:50% 100%;animation:bigFlame .13s infinite alternate}
  .foreground-flame:after{content:"";position:absolute;left:8px;top:18px;width:9px;height:39px;background:linear-gradient(#fffde2,#fff3a0 60%,#ffbd27);border-radius:50% 50% 45% 45%;filter:blur(1px);animation:innerFlame .17s infinite alternate}
  @keyframes bigFlame{from{transform:rotate(-5deg) scale(.94,.98)}to{transform:rotate(5deg) scale(1.08,1.04)}}
  @keyframes innerFlame{from{transform:translateX(-2px) scaleY(.92)}to{transform:translateX(2px) scaleY(1.08)}}


/* Final-screen share action */
.final-share-wrap{position:relative;z-index:45;margin:18px auto 26px;text-align:center;padding:0 14px}
.final-share-btn{border:0;border-radius:999px;padding:13px 22px;background:linear-gradient(135deg,#ffe7a0,#ffbd45);color:#642b00;font-weight:800;font-size:16px;box-shadow:0 5px 18px #ffb52b66;cursor:pointer}
.final-share-note{color:#fff4cf;font-size:13px;margin-top:8px}

</style>
</head>

  <div class="instruction">1. தீக்குச்சியைத் தொட்டு தீப்பெட்டியின் மேல் தேய்க்கவும்<br>2. எரியும் தீக்குச்சியை விளக்கின் திரிக்கு அருகில் கொண்டு செல்லவும்</div>
</main>
<script>
const match=document.getElementById('match'), box=document.querySelector('.matchbox'),
flame=document.getElementById('flame'), message=document.getElementById('message'),
again=document.getElementById('again'), diya=document.getElementById('diya');
let dragging=false, lit=false, start={x:0,y:0}, offset={x:0,y:0};
function point(e){return {x:e.clientX,y:e.clientY}}
match.addEventListener('pointerdown',e=>{if(lit)return;dragging=true;match.setPointerCapture(e.pointerId);start=point(e);offset={x:match.offsetLeft,y:match.offsetTop};});
match.addEventListener('pointermove',e=>{
 if(!dragging)return;const p=point(e);match.style.left=(offset.x+p.x-start.x)+'px';match.style.top=(offset.y+p.y-start.y)+'px';match.style.bottom='auto';
 const r=box.getBoundingClientRect(),m=match.getBoundingClientRect();
 if(m.left<r.right&&m.right>r.left&&m.top<r.bottom&&m.bottom>r.top)match.classList.add('fire');
 const d=diya.getBoundingClientRect();
 if(match.classList.contains('fire')&&m.left<d.right&&m.right>d.left&&m.top<d.bottom&&m.bottom>d.top)lightLamp();
});
match.addEventListener('pointerup',()=>{dragging=false});
const lampRows=document.getElementById('lampRows');
for(let i=0;i<108;i++){const d=document.createElement('span');d.className='tiny-diya';lampRows.appendChild(d);}
const stepLamps=document.getElementById('stepLamps');
for(let i=0;i<13;i++){const d=document.createElement('span');d.className='tiny-diya';stepLamps.appendChild(d);}
let revealTimer;
function lightLamp(){if(lit)return;lit=true;flame.classList.add('lit');message.classList.add('show');again.classList.add('show');document.getElementById('reveal').classList.add('open');}
document.getElementById('closeReveal').addEventListener('click',()=>document.getElementById('reveal').classList.remove('open'));
diya.addEventListener('click',()=>{if(match.classList.contains('fire'))lightLamp()});
again.addEventListener('click',()=>{clearTimeout(revealTimer);document.getElementById('reveal').classList.remove('open');lit=false;flame.classList.remove('lit');message.classList.remove('show');again.classList.remove('show');match.classList.remove('fire');match.removeAttribute('style');});
document.getElementById('share').addEventListener('click',async()=>{
 const data={title:'இனிய கார்த்திகை திருநாள் நல்வாழ்த்துக்கள்',text:'இந்த அழகான கார்த்திகை தீப வாழ்த்தை பாருங்கள் 🪔',url:location.href};
 if(navigator.share){try{await navigator.share(data)}catch(e){}}
 else {try{await navigator.clipboard.writeText(location.href);alert('லிங்க் copy செய்யப்பட்டது. WhatsApp / Facebook-ல் பகிரலாம்.')}catch(e){alert('இந்த பக்கத்தின் முகவரியை copy செய்து பகிரவும்: '+location.href)}}
});
</script>

<script>
async function shareKarthigaiWish(){
  const pageUrl = window.location.href;
  const shareText = "இனிய கார்த்திகை தீபத் திருநாள் நல்வாழ்த்துக்கள்! இந்த அழகான வாழ்த்தைப் பாருங்கள் ✨";
  if (navigator.share) {
    try {
      await navigator.share({title:"கார்த்திகை தீபம் வாழ்த்து", text:shareText, url:pageUrl});
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return;
    }
  }
  const whatsappUrl = "https://wa.me/?text=" + encodeURIComponent(shareText + " " + pageUrl);
  window.open(whatsappUrl, "_blank", "noopener,noreferrer");
}
</script>
